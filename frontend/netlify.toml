[build]
  base = "frontend"
  publish = "build"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"
  REACT_APP_API_URL = "https://writely-log.onrender.com/api"
  REACT_APP_CLOUDINARY_CLOUD_NAME = "dl5xtuwim"
  REACT_APP_UPLOAD_PRESET = "blog-upload"

[[redirects]]
  from = "/api/*"
  to = "https://writely-log.onrender.com/api/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
