services:
  - type: web
    name: blogging-platform-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    port: 5000
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_ATLAS_URI
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: REACT_APP_UPLOAD_PRESET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
